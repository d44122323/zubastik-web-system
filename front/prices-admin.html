<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Цены | Администратор</title>
    <link rel="stylesheet" href="prices-admin.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="ui-polish.css" />
  </head>
  <body>
    <div class="admin-page">
      <header class="admin-header">
        <a href="dashboard.html" class="admin-logo-link"
          ><img src="img/logo.png" class="logo" alt="logo"
        /></a>
        <h1>Управление услугами</h1>
      </header>
      <nav class="navigation">
        <a href="dashboard.html" class="">Dashboard</a>
        <a href="requests.html" class="">Заявки</a>
        <a href="doctors-admin.html" class="">Врачи</a>
        <a href="patients.html" class="">Пациенты</a>
        <a href="prices-admin.html" class="active">Цены</a>
        <a href="analytics.html" class="">Аналитика</a>
      </nav>
      <div class="divider"></div>
      <section class="page-title">
        <h2>Услуги, разделы и цены</h2>
        <p>
          Здесь можно добавлять услуги, менять название, раздел, цену, порядок
          отображения и активность. Изменения сразу используются на сайте, в
          калькуляторе, заявках и записи врача.
        </p>
      </section>
      <div class="create-service">
        <input id="newCategory" placeholder="Новый или существующий раздел" />
        <input id="newName" placeholder="Название услуги" />
        <input
          id="newPrice"
          type="number"
          min="0"
          placeholder="Цена, ₽"
          value="0"
        />
        <input
          id="newOrder"
          type="number"
          min="0"
          placeholder="Порядок"
          value="0"
        />
        <label><input id="newActive" type="checkbox" checked /> Активна</label>
        <button id="addServiceBtn" class="save-btn" type="button">
          Добавить услугу
        </button>
      </div>
      <div class="toolbar">
        <input id="search" placeholder="🔍 Поиск услуги или раздела" /><select
          id="category"
        >
          <option value="">Все разделы</option>
        </select>
      </div>
      <section id="services" class="services"></section>
    </div>
    <script src="prices-admin.js" defer></script>
  </body>
</html>
